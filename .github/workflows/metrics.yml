name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: tannerhawkins
          template: classic
          base: header, activity
          config_timezone: America/New_York
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_music: yes
          plugin_music_limit: 3
          plugin_music_mode: top
          plugin_music_provider: spotify
          plugin_music_time_range: medium
          plugin_music_top_type: artists
          plugin_music_user: tannerhawkins2703
          plugin_music_token: ${{ secrets.SPOTIFY_TOKEN }}
          plugin_steam: yes
          plugin_steam_achievements_limit: 2
          plugin_steam_games_limit: 2
          plugin_steam_playtime_threshold: 2
          plugin_steam_recent_games_limit: 2
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_user: 76561198101442019
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
