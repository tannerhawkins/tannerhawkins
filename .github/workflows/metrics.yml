name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pre-pull metrics image for forked action
        run: |
          docker pull ghcr.io/lowlighter/metrics:v3.35-beta
          docker tag ghcr.io/lowlighter/metrics:v3.35-beta metrics:forked-3.35.0-beta
      - uses: tannerhawkins/metrics@12681f0d9568dc58e321c184c040d673a5760d2c
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: tannerhawkins
          template: classic
          base: header, activity
          config_timezone: America/New_York
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_music: yes
          plugin_music_limit: 3
          plugin_music_mode: top
          plugin_music_provider: spotify
          plugin_music_time_range: medium
          plugin_music_top_type: artists
          plugin_music_user: tannerhawkins2703
          plugin_music_token: ${{ secrets.SPOTIFY_TOKEN }}
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_games_limit: 1
          plugin_steam_recent_games_limit: 1
          plugin_steam_user: "76561198101442019"
