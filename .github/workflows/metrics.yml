name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Prepare forked metrics image
        run: |
          set -euo pipefail
          FORK_REF=a1f041295463bbc36921c97a635786b490c9b62a
          FORK_IMAGE=ghcr.io/tannerhawkins/metrics:${FORK_REF}
          LOCAL_IMAGE=metrics:forked-3.35.0-beta

          echo "Attempting to pull fork image: ${FORK_IMAGE}"
          if docker pull "${FORK_IMAGE}"; then
            docker tag "${FORK_IMAGE}" "${LOCAL_IMAGE}"
            SOURCE_MODE=pulled
            SOURCE_REF="${FORK_IMAGE}"
          else
            echo "Fork image pull unavailable, building from fork ref ${FORK_REF}"
            docker build --tag "${LOCAL_IMAGE}" "https://github.com/tannerhawkins/metrics.git#${FORK_REF}"
            SOURCE_MODE=built
            SOURCE_REF="https://github.com/tannerhawkins/metrics.git#${FORK_REF}"
          fi

          echo "METRICS_FORK_REF=${FORK_REF}" >> "${GITHUB_ENV}"
          echo "METRICS_FORK_IMAGE_SOURCE_MODE=${SOURCE_MODE}" >> "${GITHUB_ENV}"
          echo "METRICS_FORK_IMAGE_SOURCE_REF=${SOURCE_REF}" >> "${GITHUB_ENV}"
      - name: Verify forked metrics image
        run: |
          set -euo pipefail
          echo "Fork commit: ${METRICS_FORK_REF}"
          echo "Image source mode: ${METRICS_FORK_IMAGE_SOURCE_MODE}"
          echo "Image source ref: ${METRICS_FORK_IMAGE_SOURCE_REF}"
          echo "Local image tag: metrics:forked-3.35.0-beta"
          docker image inspect metrics:forked-3.35.0-beta --format 'Image ID={{.Id}}'
          docker image inspect metrics:forked-3.35.0-beta --format 'RepoTags={{json .RepoTags}}'
          docker image inspect metrics:forked-3.35.0-beta --format 'RepoDigests={{json .RepoDigests}}'
      - uses: tannerhawkins/metrics@a1f041295463bbc36921c97a635786b490c9b62a
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: tannerhawkins
          template: classic
          base: header, activity
          config_timezone: America/New_York
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_music: yes
          plugin_music_limit: 3
          plugin_music_mode: top
          plugin_music_provider: spotify
          plugin_music_time_range: medium
          plugin_music_top_type: artists
          plugin_music_user: tannerhawkins2703
          plugin_music_token: ${{ secrets.SPOTIFY_TOKEN }}
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_games_limit: 1
          plugin_steam_recent_games_limit: 1
          plugin_steam_user: "76561198101442019"
